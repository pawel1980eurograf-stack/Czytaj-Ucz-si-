<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F1EC">
<title>Czytaj i ucz się</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F1EC; --paper-2:#FAF9F6; --ink:#1B1A19; --ink-soft:#5C5A55;
  --atrament:#2E2A82; --marker:#FFE066; --marker-deep:#F2C200; --on-marker:#1B1A19;
  --mint:#1F8A6B; --coral:#C8483E; --line:rgba(27,26,25,.14); --known:rgba(31,138,107,.18);
  --shadow:0 10px 30px rgba(27,26,25,.12);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
body.dark{
  --paper:#1A1A1E; --paper-2:#232329; --ink:#EAE7DF; --ink-soft:#96938B;
  --atrament:#A9A2FF; --marker:#F5CE3E; --marker-deep:#C9A21B; --on-marker:#1A1A1E;
  --mint:#4CC79C; --coral:#E4776B; --line:rgba(234,231,223,.16); --known:rgba(76,199,156,.2);
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--read);overscroll-behavior-y:none;transition:background .25s ease,color .25s ease}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}

#app{max-width:720px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:20;background:var(--paper)}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1}
.brand span{color:var(--atrament)}
.hgroup{display:flex;align-items:center;gap:12px}
.meter{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em;text-align:right;line-height:1.4}
.meter b{color:var(--ink);font-weight:600}
.themebtn{border:1px solid var(--line);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink-soft)}
.themebtn:active{transform:scale(.94)}

main{flex:1;padding:0 18px 130px}
.view{display:none;animation:rise .28s ease both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 8px}

.card{background:var(--paper-2);border:1px solid var(--line);border-radius:2px;padding:14px 15px;margin-bottom:10px;width:100%;text-align:left;display:block}
.card:active{transform:translateY(1px)}
.card h3{font-family:var(--display);font-weight:600;font-size:17.5px;margin:0 0 4px;letter-spacing:-.01em}
.card .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.lvl{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:1px;margin-right:8px}
.card .done{color:var(--mint)}

.backlink{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft);padding:10px 0;display:inline-block}
h2.title{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.1;letter-spacing:-.025em;margin:2px 0 6px}
.subtitle{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.prose{font-size:19px;line-height:1.78}
.prose p{margin:0 0 1.15em}
.hint{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--ink-soft);border-left:2px solid var(--marker-deep);padding:6px 0 6px 10px;margin:0 0 22px}
.playbar{display:flex;gap:8px;margin:0 0 18px}
.playbar button{flex:1;border:1px solid var(--line);background:var(--paper-2);padding:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px}
.playbar button.act{border-color:var(--atrament);color:var(--atrament)}

.w{cursor:pointer;border-radius:1px;padding:0 .5px}
.w:hover{text-decoration:underline;text-decoration-color:var(--marker-deep);text-decoration-thickness:2px;text-underline-offset:3px}
.w.pl{color:var(--on-marker);font-style:italic;background-image:linear-gradient(var(--marker),var(--marker));
  background-repeat:no-repeat;background-position:0 .12em;background-size:100% 1.05em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 2px;margin:0 -1px;animation:swipe .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes swipe{from{background-size:0% 1.05em}to{background-size:100% 1.05em}}
.w.loading{opacity:.45}
.w.known{background-image:linear-gradient(var(--known),var(--known));background-repeat:no-repeat;background-position:0 .12em;background-size:100% 1.05em}
.w.speaking{background-image:linear-gradient(var(--marker),var(--marker));background-repeat:no-repeat;background-position:0 .12em;background-size:100% 1.05em;color:var(--on-marker)}

.wrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.wrow .en{font-family:var(--display);font-weight:600;font-size:16.5px}
.wrow .pl{font-size:15px;color:var(--ink-soft);font-style:italic}
.wrow .col{flex:1;min-width:0}
.wrow .col div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.due.now{color:var(--coral)}
.iconbtn{color:var(--ink-soft);padding:6px}
.iconbtn:active{color:var(--atrament)}
.empty{border:1px dashed var(--line);padding:22px 16px;text-align:center;color:var(--ink-soft);font-size:15px;line-height:1.6;margin-top:10px}
.empty b{font-family:var(--display);color:var(--ink);display:block;font-size:17px;margin-bottom:6px}

.slip{background:var(--paper-2);border:1px solid var(--line);border-top:5px solid var(--marker);padding:34px 22px;text-align:center;margin-top:14px;box-shadow:var(--shadow);min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.slip .en{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:10px}
.slip .pl{font-size:22px;font-style:italic;color:var(--atrament);animation:rise .22s ease both}
.slip .ctx{font-size:14.5px;line-height:1.65;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px}
.slip .ctx em{background:linear-gradient(var(--marker),var(--marker));color:var(--on-marker);font-style:normal;padding:0 2px}
.reveal{margin-top:16px;width:100%;border:1px solid var(--ink);padding:14px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.grade{border:1px solid var(--line);background:var(--paper-2);padding:12px 4px;text-align:center;line-height:1.3}
.grade b{display:block;font-family:var(--display);font-weight:600;font-size:14px}
.grade span{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft)}
.grade.g1{border-bottom:3px solid var(--coral)}
.grade.g2{border-bottom:3px solid var(--marker-deep)}
.grade.g3{border-bottom:3px solid var(--atrament)}
.grade.g4{border-bottom:3px solid var(--mint)}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);background:var(--paper-2);padding:14px}
.tile .num{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
.tile .lab{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.tile.accent .num{color:var(--atrament)}
.tile.mintc .num{color:var(--mint)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);padding-top:8px}
.bar{flex:1;background:var(--atrament);min-height:2px;position:relative;opacity:.85;transition:height .4s ease}
.bar.zero{background:var(--line)}
.bar b{position:absolute;top:-15px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;color:var(--ink-soft);font-weight:400}
.axis{display:flex;gap:4px;margin-top:5px}
.axis span{flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;color:var(--ink-soft)}
.mix{display:flex;height:10px;margin-top:10px;border:1px solid var(--line)}
.mix i{display:block;height:100%}
.legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}

/* plan nauki + sesja */
.chips{display:flex;gap:5px;margin:2px 0 12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper-2);width:38px;height:38px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--ink-soft)}
.chip.on{border-color:var(--atrament);color:var(--atrament);background:color-mix(in srgb,var(--atrament) 10%,var(--paper-2))}
.opts{display:flex;gap:5px;margin:2px 0 12px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--paper-2);padding:8px 12px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.opt.on{border-color:var(--atrament);color:var(--atrament)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--paper-2);padding:11px 14px;margin-bottom:8px;font-size:15px}
.field input[type=time]{border:1px solid var(--line);background:var(--paper);padding:6px 8px;font-family:var(--mono);font-size:14px}
.goal{border-left:2px solid var(--atrament);padding:8px 0 8px 12px;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--ink-soft);margin:4px 0 18px}
.goal b{color:var(--ink)}
.sessionbar{border:1px solid var(--line);background:var(--paper-2);padding:11px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.sessionbar .clock{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.sessionbar .lab{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.sessionbar button{border:1px solid var(--line);padding:8px 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.sessionbar button.go{border-color:var(--atrament);color:var(--atrament)}
.prog{height:3px;background:var(--line);margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--atrament);transition:width .3s}
.cover{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mint);border:1px solid var(--line);padding:2px 6px;display:inline-block;margin-left:6px}
.cover.warn{color:var(--coral)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--paper-2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);max-width:720px;margin:0 auto}
nav button{padding:10px 2px 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);position:relative}
nav button .n{display:block;font-family:var(--display);font-size:15.5px;font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--ink);margin-bottom:1px}
nav button.on{color:var(--atrament)}
nav button.on .n{color:var(--atrament)}
nav button.on::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--atrament)}
.badge{position:absolute;top:5px;right:12%;background:var(--coral);color:#fff;font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:9px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:60;background:var(--ink);color:var(--paper);padding:9px 14px;font-size:14px;box-shadow:var(--shadow);max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s}
.toast.on{opacity:1;bottom:100px}
.toast i{color:var(--marker-deep);font-style:normal}
.rowbtn{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper-2);padding:13px 14px;margin-bottom:8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rowbtn small{font-family:var(--mono);font-size:10px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}
.rowbtn .sw{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;white-space:nowrap}
.rowbtn .sw.on{border-color:var(--mint);color:var(--mint)}
.gen{border-color:var(--atrament);color:var(--atrament)}
input.txt{width:100%;border:1px solid var(--line);background:var(--paper-2);padding:12px;margin-bottom:8px;font-size:16px;border-radius:0}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--atrament);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--atrament);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Czytaj<span>&amp;</span>Ucz się</div>
    <div class="hgroup">
      <div class="meter" id="meter">…</div>
      <button class="themebtn" id="themebtn" aria-label="Zmień motyw"></button>
    </div>
  </header>

  <main>
    <section class="view on" id="v-read"><div id="textlist"></div></section>

    <section class="view" id="v-reader">
      <button class="backlink" onclick="go('read')">← Wszystkie teksty</button>
      <h2 class="title" id="r-title"></h2>
      <div class="subtitle" id="r-sub"></div>
      <div class="playbar">
        <button id="playbtn"></button>
        <button id="slowbtn"></button>
      </div>
      <div class="hint">Dotknij słowa, którego nie znasz — zamieni się na polskie i trafi do zakładki Słowa. Dotknij ponownie, żeby wrócić do angielskiego.</div>
      <div class="prose" id="r-body"></div>
    </section>

    <section class="view" id="v-words">
      <div class="eyebrow">Słowa do nauki</div>
      <div id="wordlist"></div>
    </section>

    <section class="view" id="v-review">
      <div class="eyebrow">Powtórki</div>
      <div id="sessionbox"></div>
      <div id="reviewbox"></div>
    </section>

    <section class="view" id="v-stats"><div id="statsbox"></div></section>
  </main>

  <nav>
    <button id="n-read" class="on" onclick="go('read')"><span class="n">Teksty</span>czytaj</button>
    <button id="n-words" onclick="go('words')"><span class="n">Słowa</span>zebrane</button>
    <button id="n-review" onclick="go('review')"><span class="n">Powtórki</span>anki</button>
    <button id="n-stats" onclick="go('stats')"><span class="n">Postępy</span>statystyki</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

const BUILTIN=[
{id:"t1",lvl:"A2",title:"A Long Day in the City",body:`Anna wakes up early. The sky outside her window is still grey and the street below is quiet. She makes a cup of coffee, opens the window and listens to the city. Somewhere a dog is barking. A bus stops at the corner and a few people get on.

At eight o'clock she leaves the house. The walk to the station takes ten minutes. Today the train is late again, so she waits on the platform and reads the news on her phone. When the train finally comes, there are no free seats, and she stands near the door with her bag between her feet.

Anna works in a small office near the river. Her job is not difficult, but there is always a lot to do. She answers emails, talks to customers on the phone and writes short reports. At lunch she buys a sandwich and eats it outside, on a bench by the water. The sun is warm now. For twenty minutes she does not think about work at all.

In the afternoon her boss asks her to finish a report before Friday. Anna is tired, but she says yes. She knows she can do it.

She comes home at seven. The flat is cold, so she puts on a sweater and cooks a simple dinner: rice, eggs and vegetables. Later she calls her sister and they laugh about something stupid. Before she goes to bed, she opens the window again. The city is louder now, but she sleeps well.`},
{id:"t2",lvl:"A2+",title:"The First Week at a New Job",body:`On Monday morning Tomek stands in front of a tall glass building and checks the time again. He is twenty minutes early. He walks around the block once, then goes inside.

A woman at the desk gives him a card with his name on it. "Fourth floor," she says. "They are waiting for you."

Nobody is waiting for him. The office is almost empty. A man with grey hair looks up from his computer, shakes his hand and shows him a desk near the window. "This is yours. Your laptop should arrive tomorrow. Or on Wednesday."

For two days Tomek does almost nothing. He reads old documents, learns the names of people he will forget by lunch, and drinks too much bad coffee. He begins to think that he made a mistake.

On Thursday everything changes. His manager asks him to join a meeting with a client. Tomek understands maybe half of what they say. There are strange words, short forms, jokes he does not get. But at the end he asks one simple question, and the room becomes quiet. The client thinks for a moment and then says: "That is a very good point."

On Friday evening, walking to the bus, Tomek feels different. He still knows almost nothing about the company. But he knows that he can learn it.`},
{id:"t3",lvl:"B1",title:"Living in Another Country",body:`People often say that the hardest part of living abroad is the language. In my experience, that is only true for the first few months.

When I moved to another country, I could already speak the language quite well. I could order food, ask for directions and understand the news. What I could not do was understand people. I did not know why my neighbours never invited anyone home, why my colleagues laughed at certain jokes, or why nobody talked about money.

The small things were the most difficult. Shops closed at strange hours. Nobody answered emails on Sunday. When I said "we should meet sometime", people wrote it in their calendars, and I learned to be careful with promises.

I also discovered that I became a slightly different person in my second language. I was more polite, and less funny. My voice sounded flat to me. Sometimes I stayed quiet in a group not because I had nothing to say, but because saying it would take too long.

After two years, most of that disappeared. I still make mistakes every day. I still miss the food, and certain conversations with old friends. But now I have two places that feel like home, and neither of them is complete without the other.

If you are thinking about moving abroad, do not wait until your English is perfect. It never will be. Go, and let the language follow you.`},
{id:"t4",lvl:"B1+",title:"Why We Need Sleep",body:`Everyone knows that sleep is important, but few people treat it that way. We cut it first when we are busy, as if it were free time that we can simply take back later.

During the night the brain is far from silent. It moves through several stages of sleep, again and again. In deep sleep the body repairs muscles and builds bone, and the immune system becomes stronger. Later, in the stage when we dream, the brain seems to organise the memories of the day, keeping what matters and quietly dropping the rest.

This is why a student who studies all night usually remembers less than one who studies less and then sleeps. Without sleep, new information stays weak and disappears fast.

The effects of too little sleep appear quickly. After a few short nights most people react more slowly, make more mistakes and find it harder to control their emotions. Many drivers on the road are, in practice, as dangerous as if they had been drinking.

The advice is boring, because it always is: go to bed and get up at similar times, keep the room dark and cool, and leave the phone in another room. Light in the evening tells the body that the day is not over yet.

Nobody becomes healthy in a single night. But almost everything else you are trying to improve — your memory, your mood, your work — becomes easier when you finally sleep enough.`},
{id:"t5",lvl:"B2",title:"The Phone in Your Pocket",body:`A hundred years ago a person could disappear for an afternoon and nobody would think about it. Today, if we do not answer a message within an hour, someone begins to worry, or to be annoyed.

The phone in your pocket is probably the most useful object you own. It is a map, a camera, a bank, a library and a ticket. It has also quietly changed what we expect from each other. We assume that everybody is available all the time, and that any question can be answered immediately.

The problem is not the technology itself but the way it fits into our attention. Companies do not sell us phones and then lose interest; they sell our attention to somebody else. Every notification, every small red circle, was designed by people who are very good at their job.

None of this means we should throw our phones into the river. Most attempts to escape completely fail after a week, and they miss the point. What works better is boring and practical: fewer applications that send notifications, a screen that is grey instead of colourful, and a rule about where the phone sleeps at night.

Attention is the one thing we cannot buy more of. It is worth deciding, at least once, who gets it.`}];

/* Warstwa zapisu: Capacitor Preferences w apce, localStorage w przeglądarce,
   window.storage w podglądzie artefaktu. Jedno miejsce do podmiany. */
const CAP=()=>window.Capacitor&&window.Capacitor.Plugins||{};
const Store={
  async get(k){
    const P=CAP().Preferences;
    if(P){const r=await P.get({key:k});return r.value?{value:r.value}:null;}
    if(window.storage){try{return await window.storage.get(k);}catch(e){}}
    try{const v=localStorage.getItem(k);return v?{value:v}:null;}catch(e){return null;}
  },
  async set(k,v){
    const P=CAP().Preferences;
    if(P)return P.set({key:k,value:v});
    if(window.storage){try{return await window.storage.set(k,v);}catch(e){}}
    try{localStorage.setItem(k,v);}catch(e){}
  },
  async del(k){
    const P=CAP().Preferences;
    if(P)return P.remove({key:k});
    if(window.storage){try{return await window.storage.delete(k);}catch(e){}}
    try{localStorage.removeItem(k);}catch(e){}
  }
};

const canSpeak=()=>typeof speechSynthesis!=="undefined";
let voice=null;
function pickVoice(){if(!canSpeak())return;const v=speechSynthesis.getVoices();voice=v.find(x=>/^en[-_]GB/i.test(x.lang))||v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
if(canSpeak()){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,opts={}){
  if(!canSpeak()){toast("Wymowa niedostępna w tym widoku");return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-GB";u.rate=opts.rate||S.rate;
    if(voice)u.voice=voice;
    if(opts.onend)u.onend=opts.onend;
    speechSynthesis.speak(u);
  }catch(e){toast("Wymowa niedostępna w tym widoku");}
}
function stopSpeak(){if(canSpeak())speechSynthesis.cancel();}

function forms(w){
  w=w.toLowerCase().replace(/[''`]s$/,"").replace(/[^a-z'-]/g,"");
  const c=[w];
  if(w.endsWith("ies"))c.push(w.slice(0,-3)+"y");
  if(w.endsWith("es"))c.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith("s"))c.push(w.slice(0,-1));
  if(w.endsWith("ed")){c.push(w.slice(0,-2),w.slice(0,-1));if(w.length>4&&w[w.length-3]===w[w.length-4])c.push(w.slice(0,-3));}
  if(w.endsWith("ing")){c.push(w.slice(0,-3),w.slice(0,-3)+"e");if(w.length>5&&w[w.length-4]===w[w.length-5])c.push(w.slice(0,-4));}
  if(w.endsWith("ly"))c.push(w.slice(0,-2));
  if(w.endsWith("ily"))c.push(w.slice(0,-3)+"y");
  if(w.endsWith("er"))c.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith("est"))c.push(w.slice(0,-3),w.slice(0,-2));
  if(w.endsWith("ier"))c.push(w.slice(0,-3)+"y");
  if(w.endsWith("ness"))c.push(w.slice(0,-4));
  return c;
}
function offline(w){for(const f of forms(w))if(DICT[f])return{base:f,pl:DICT[f]};return null;}

/* słowa spoza listy 3000 (nazwy własne w środku zdania są dozwolone) */
function outsideList(text){
  const bad=new Set();
  text.split(/(?<=[.!?])\s+|\n+/).forEach(sent=>{
    const toks=sent.match(/[A-Za-z][A-Za-z'-]*/g)||[];
    toks.forEach((w,i)=>{
      if(offline(w))return;
      if(i>0&&/^[A-Z]/.test(w))return;
      bad.add(w.toLowerCase());
    });
  });
  return [...bad];
}

async function claude(prompt){
  const inArtifact=!!window.storage&&!window.Capacitor;
  const url="https://api.anthropic.com/v1/messages";
  const headers={"Content-Type":"application/json"};
  if(!inArtifact){
    if(!S.apiKey)throw new Error("nokey");
    headers["x-api-key"]=S.apiKey;
    headers["anthropic-version"]="2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"]="true";
  }
  const r=await fetch(url,{method:"POST",headers,
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
  if(!r.ok)throw new Error("http "+r.status);
  const d=await r.json();
  return (d.content||[]).map(x=>x.text||"").join("").replace(/```json|```/g,"").trim();
}
const aiReady=()=>(!!window.storage&&!window.Capacitor)||!!S.apiKey;
async function askAI(word,sentence){
  const j=JSON.parse(await claude(
`Przetłumacz angielskie słowo na polski w tym konkretnym kontekście.
Słowo: "${word}"
Zdanie: "${sentence}"
Odpowiedz WYŁĄCZNIE obiektem JSON, bez markdown:
{"base":"forma podstawowa po angielsku","pl":"tłumaczenie po polsku, max 4 wyrazy"}`));
  if(!j.pl)throw new Error("brak");
  return{base:(j.base||word).toLowerCase(),pl:j.pl};
}

/* ---------- nawigacja ---------- */
let view="read",current=null;
function go(v){
  if(v!=="reader")stopSpeak();
  view=v;
  document.querySelectorAll(".view").forEach(e=>e.classList.remove("on"));
  document.getElementById("v-"+v).classList.add("on");

  if(v==="review"){renderSession();renderReview();}
  if(v==="stats")renderStats();

}
function meter(){
  const n=Object.keys(S.words).length,d=dueList().length;
  document.getElementById("meter").innerHTML=`<b>${n}</b> słów<br><b>${d}</b> do powtórki`;

/* ---------- teksty ---------- */
function renderTexts(){
  const el=document.getElementById("textlist");
  el.innerHTML=`<div class="eyebrow">Teksty do czytania</div>`;
  allTexts().forEach(t=>{
    const b=document.createElement("button");b.className="card";

async function genText(){
  if(!aiReady()){toast("Wklej klucz API w Postępy → Ustawienia");return;}
  const topic=(document.getElementById("topic").value||"codzienne życie").trim();
  const btn=document.getElementById("genbtn");
  const step=(s)=>{btn.innerHTML=`${s} <span class="spin"></span>`;};
  btn.disabled=true;step("Piszę tekst…");
  const rules=`Wolno użyć WYŁĄCZNIE słów z tej listy (dowolne formy gramatyczne tych słów są w porządku: liczba mnoga, czasy przeszłe, -ing, stopniowanie). Imion własnych osób i miast możesz użyć swobodnie.
LISTA: ${WORDLIST.join(" ")}`;
  try{
    let j=JSON.parse(await claude(
`Napisz tekst po angielsku dla Polaka uczącego się języka (poziom B1). Temat: ${topic}
${rules}
Dalsze zasady: 200-240 słów, 4-5 akapitów, naturalny styl, konkretne przykłady.
Odpowiedz WYŁĄCZNIE obiektem JSON, bez markdown:
{"title":"angielski tytuł","text":"treść z akapitami rozdzielonymi \\n\\n"}`));
    let bad=outsideList(j.title+". "+j.text);
    for(let i=0;i<3&&bad.length;i++){
      step(`Poprawiam ${bad.length} słów…`);
      j=JSON.parse(await claude(
`Popraw ten angielski tekst. Te słowa są spoza dozwolonej listy: ${bad.join(", ")}.
Zastąp każde z nich prostszym słowem lub przeformułuj zdanie. Nie zmieniaj sensu ani długości.
${rules}
TEKST: ${j.title}\n\n${j.text}
Odpowiedz WYŁĄCZNIE obiektem JSON: {"title":"...","text":"..."}`));
      bad=outsideList(j.title+". "+j.text);
    }
    const total=(j.text.match(/[A-Za-z][A-Za-z'-]*/g)||[]).length;
    const t={id:"g"+Date.now(),lvl:"B1",title:j.title||topic,body:j.text,cover:Math.max(0,Math.round((1-bad.length/Math.max(1,total))*1000)/10),bad:bad.length};
    S.texts.unshift(t);save();renderTexts();openText(t.id);
    toast(bad.length?`Gotowe — ${bad.length} słów spoza listy`:"Gotowe — 100% z listy 3000");
  }catch(e){btn.innerHTML=`Nie udało się — spróbuj ponownie <small>ai</small>`;btn.disabled=false;}
}

/* ---------- czytnik ---------- */
let playing=false;
function openText(id){
  const t=allTexts().find(x=>x.id===id);if(!t)return;
  current=t;S.read[id]=true;save();
  document.getElementById("r-title").textContent=t.title;
  const badge=t.cover===undefined?`<span class="cover">100% z listy 3000</span>`:
    (t.bad?`<span class="cover warn">${t.cover}% z listy</span>`:`<span class="cover">100% z listy 3000</span>`);
  document.getElementById("r-sub").innerHTML=t.lvl+" · "+t.body.split(/\s+/).length+" słów "+badge;
  const body=document.getElementById("r-body");body.innerHTML="";
  t.body.split(/\n\s*\n/).forEach(par=>{
    const p=document.createElement("p");
    par.split(/(\s+)/).forEach(tok=>{
      if(/^\s+$/.test(tok)){p.appendChild(document.createTextNode(tok));return;}
      const m=tok.match(/^([^A-Za-z]*)([A-Za-z][A-Za-z'''-]*)([^A-Za-z]*)$/);
      if(!m){p.appendChild(document.createTextNode(tok));return;}
      if(m[1])p.appendChild(document.createTextNode(m[1]));
      const s=document.createElement("span");
      s.className="w";s.dataset.en=m[2];s.textContent=m[2];
      const k=offline(m[2]);if(k&&S.words[k.base])s.classList.add("known");
      s.onclick=()=>tapWord(s,par);
      p.appendChild(s);
      if(m[3])p.appendChild(document.createTextNode(m[3]));
    });
    body.appendChild(p);
  });
  playing=false;drawPlaybar();go("reader");
}
function drawPlaybar(){
  const p=document.getElementById("playbtn"),s=document.getElementById("slowbtn");
  p.innerHTML=(playing?IC.stop:IC.play)+(playing?"Zatrzymaj":"Odsłuchaj tekst");
  p.classList.toggle("act",playing);
  s.innerHTML=IC.speaker+(S.rate<.8?"Tempo wolne":"Tempo normalne");
  s.classList.toggle("act",S.rate<.8);
  p.onclick=()=>{if(playing){stopSpeak();playing=false;drawPlaybar();}else{playing=true;drawPlaybar();speak(current.body,{onend:()=>{playing=false;drawPlaybar();}});}};
  s.onclick=()=>{S.rate=S.rate<.8?.92:.68;save();drawPlaybar();if(playing)speak(current.body,{onend:()=>{playing=false;drawPlaybar();}});};
}
function sentenceOf(par,word){
  const parts=par.split(/(?<=[.!?])\s+/);
  const hit=parts.find(x=>new RegExp("\\b"+word.replace(/[^A-Za-z']/g,"")+"\\b","i").test(x));
  return(hit||par).slice(0,240);
}
async function tapWord(el,par){
  const en=el.dataset.en;
  if(S.speakTap)speak(en);
  if(el.classList.contains("pl")){el.classList.remove("pl");el.textContent=en;return;}
  if(el.dataset.pl){reveal(el);return;}
  const off=offline(en);
  if(off){el.dataset.pl=off.pl;reveal(el);addWord(off.base,off.pl,sentenceOf(par,en),en);return;}
  el.classList.add("loading");
  try{
    const ai=await askAI(en,sentenceOf(par,en));
    DICT[ai.base]=ai.pl;el.dataset.pl=ai.pl;el.classList.remove("loading");reveal(el);
    addWord(ai.base,ai.pl,sentenceOf(par,en),en);
  }catch(e){el.classList.remove("loading");toast("Brak tłumaczenia offline — połącz się z siecią");}
}
function reveal(el){el.textContent=el.dataset.pl;el.classList.add("pl");}
function addWord(base,pl,ctx,seen){
  if(S.words[base]){toast(`Już zapisane: <i>${base}</i>`);return;}
  S.words[base]={pl,ctx,seen,due:Date.now(),ivl:0,ease:2.5,reps:0,added:Date.now()};
  H().a++;save();meter();toast(`Do nauki: <i>${base}</i> → ${pl}`);
}

/* ---------- słowa ---------- */
function renderWords(){

  el.innerHTML="";
  ks.forEach(k=>{

    row.innerHTML=`<button class="iconbtn" aria-label="Posłuchaj">${IC.speaker}</button>

/* ---------- sesja z timerem ---------- */
let sesEnd=null,sesCount=0,sesGood=0,tick=null;
const dailyGoal=()=>Math.max(5,Math.round(S.plan.minutes*6*S.plan.perDay));
function startSession(){
  sesEnd=Date.now()+S.plan.minutes*6e4;sesCount=0;sesGood=0;
  clearInterval(tick);tick=setInterval(()=>{
    if(!sesEnd)return;
    if(Date.now()>=sesEnd)return endSession(true);
    if(view==="review")renderSession();
  },1000);
  renderSession();renderReview();
}
function endSession(auto){
  clearInterval(tick);tick=null;sesEnd=null;
  const acc=sesCount?Math.round(sesGood/sesCount*100):0;
  renderSession();
  if(auto)speak("Time is up. Good job.");
  document.getElementById("reviewbox").innerHTML=
    `<div class="empty"><b>Sesja skończona</b>Fiszek: ${sesCount} · trafnych: ${acc}%<br>Powtórzone dziś: ${S.reviewedToday} z celu ${dailyGoal()}.</div>
     <button class="rowbtn gen" style="margin-top:10px" onclick="startSession()">Jeszcze jedna sesja <small>${S.plan.minutes} min</small></button>
     <button class="rowbtn" onclick="renderReview()">Ucz się dalej bez timera <small>swobodnie</small></button>`;
}
function renderSession(){
  const box=document.getElementById("sessionbox");
  const done=S.reviewedToday,goal=dailyGoal();
  if(sesEnd){
    const left=Math.max(0,sesEnd-Date.now());
    const mm=String(Math.floor(left/6e4)).padStart(2,"0"),ss=String(Math.floor(left%6e4/1000)).padStart(2,"0");
    box.innerHTML=`<div class="sessionbar"><div><div class="clock">${mm}:${ss}</div><div class="lab">fiszek w sesji: ${sesCount}</div></div>
      <button onclick="endSession(false)">Zakończ sesję</button></div>
      <div class="prog"><i style="width:${Math.min(100,100-left/(S.plan.minutes*6e4)*100)}%"></i></div>`;
  }else{
    box.innerHTML=`<div class="sessionbar"><div><div class="clock">${done}/${goal}</div><div class="lab">dzisiejszy cel</div></div>
      <button class="go" onclick="startSession()">Sesja ${S.plan.minutes} min</button></div>
      <div class="prog"><i style="width:${Math.min(100,done/goal*100)}%"></i></div>`;
  }
}

/* ---------- powtórki ---------- */
function dueList(){const n=Date.now();return Object.keys(S.words).filter(k=>S.words[k].due<=n);}
let card=null,shown=false;
function renderReview(){
  const box=document.getElementById("reviewbox");
  if(S.lastReviewDay!==dayKey()){S.lastReviewDay=dayKey();S.reviewedToday=0;}
  const d=dueList();
  if(!d.length){
    const total=Object.keys(S.words).length;
    box.innerHTML=`<div class="empty"><b>${total?"Na dziś koniec":"Brak słów"}</b>${total?`Powtórzone dziś: ${S.reviewedToday}. Wróć jutro albo poczytaj kolejny tekst.`:"Zbierz kilka słów podczas czytania, a pojawią się tu fiszki."}</div>`;return;
  }
  card=d[Math.floor(Math.random()*d.length)];shown=false;
  const w=S.words[card];
  const ctx=(w.ctx||"").replace(new RegExp("\\b("+(w.seen||card)+")\\b","i"),"<em>$1</em>");
  box.innerHTML=`<div class="slip">
      <div class="en"><span>${card}</span><button class="iconbtn" id="say" aria-label="Posłuchaj">${IC.speaker}</button></div>
      <div id="answer"></div>
    </div>
    <button class="reveal" id="rev">Pokaż tłumaczenie</button>
    <div class="hint" style="margin-top:14px">Zostało dziś: ${d.length}. Powtórzone: ${S.reviewedToday}.</div>`;
  document.getElementById("say").onclick=()=>speak(card);
  document.getElementById("rev").onclick=()=>{
    if(shown)return;shown=true;speak(card);
    document.getElementById("answer").innerHTML=`<div class="pl">${w.pl}</div>${w.ctx?`<div class="ctx">${ctx}</div>`:""}`;
    document.getElementById("rev").outerHTML=`<div class="grades">
      <button class="grade g1" onclick="grade(1)"><b>Znowu</b><span>&lt;10 min</span></button>
      <button class="grade g2" onclick="grade(2)"><b>Trudne</b><span>${prev(2)}</span></button>
      <button class="grade g3" onclick="grade(3)"><b>Dobre</b><span>${prev(3)}</span></button>
      <button class="grade g4" onclick="grade(4)"><b>Łatwe</b><span>${prev(4)}</span></button></div>`;
  };
}
function nextIvl(w,g){
  if(g===1)return 0;
  if(g===2)return w.reps?Math.max(1,Math.round(w.ivl*1.2)):1;
  if(g===3)return w.reps===0?1:(w.reps===1?3:Math.round(w.ivl*w.ease));
  return w.reps===0?3:Math.max(4,Math.round(w.ivl*w.ease*1.3));
}
function prev(g){const i=nextIvl(S.words[card],g);return i<1?"10 min":i+(i===1?" dzień":" dni");}
function grade(g){
  const w=S.words[card],h=H();
  if(g===1){w.reps=0;w.ease=Math.max(1.3,w.ease-.2);w.ivl=0;w.due=Date.now()+6e5;}
  else{
    if(g===2)w.ease=Math.max(1.3,w.ease-.15);
    if(g===4)w.ease=Math.min(3.2,w.ease+.1);
    w.ivl=nextIvl(w,g);w.reps++;w.due=Date.now()+w.ivl*864e5;h.g++;if(sesEnd)sesGood++;
  }
  h.r++;S.reviewedToday++;if(sesEnd)sesCount++;
  save();meter();renderSession();renderReview();
}

/* ---------- przypomnienia ---------- */
const DN=["nd","pn","wt","śr","cz","pt","sb"];
const LN=()=>CAP().LocalNotifications;
function slots(){
  const out=[];
  for(let i=0;i<S.plan.perDay;i++)out.push([(S.plan.hour+i*4)%24,S.plan.min]);
  return out;
}
/* W apce: prawdziwe powtarzalne powiadomienia systemowe (działają przy zablokowanym telefonie).
   W przeglądarce: Notification API przy otwartej stronie. */
async function scheduleAll(){
  const N=LN();
  if(!N)return;
  try{
    const old=await N.getPending();
    if(old.notifications&&old.notifications.length)await N.cancel({notifications:old.notifications});
    if(!S.plan.on||!S.plan.days.length)return;
    const list=[];let id=1;
    S.plan.days.forEach(d=>slots().forEach(([h,m])=>{
      list.push({id:id++,title:"Czytaj & Ucz się",
        body:`Czas na angielski — sesja ${S.plan.minutes} min`,
        schedule:{on:{weekday:d+1,hour:h,minute:m},allowWhileIdle:true,repeats:true},
        smallIcon:"ic_stat_icon"});
    }));
    if(list.length)await N.schedule({notifications:list});
  }catch(e){console.log("harmonogram",e);}
}
async function togglePlan(){
  if(!S.plan.on){
    const N=LN();
    if(N){try{const p=await N.requestPermissions();if(p.display!=="granted")toast("Włącz powiadomienia w ustawieniach telefonu");}catch(e){}}
    else if(typeof Notification!=="undefined"){
      try{const p=await Notification.requestPermission();if(p!=="granted")toast("Bez zgody pokażę przypomnienie tylko w aplikacji");}catch(e){}
    }else toast("Przypomnienia zadziałają tylko przy otwartej aplikacji");
  }
  S.plan.on=!S.plan.on;save();await scheduleAll();renderStats();
}
function fire(){
  const msg=`Czas na angielski — ${S.plan.minutes} min, ${dueList().length} fiszek czeka`;
  const N=LN();
  if(N){N.schedule({notifications:[{id:999,title:"Czytaj & Ucz się",body:msg,schedule:{at:new Date(Date.now()+3000)}}]}).catch(()=>toast(msg));toast("Powiadomienie za 3 sekundy");return;}
  try{
    if(typeof Notification!=="undefined"&&Notification.permission==="granted")new Notification("Czytaj & Ucz się",{body:msg});
    else toast(msg);
  }catch(e){toast(msg);}
}
setInterval(()=>{
  if(!S.plan.on||LN())return;
  const now=new Date();
  if(!S.plan.days.includes(now.getDay()))return;
  const stamp=dayKey()+" "+now.getHours()+":"+now.getMinutes();
  if(S.lastNotify===stamp)return;
  if(slots().some(([h,m])=>h===now.getHours()&&m===now.getMinutes())){S.lastNotify=stamp;save();fire();}
},20000);

/* ---------- statystyki + ustawienia ---------- */

  let n=0,d=new Date();
  if(!(S.hist[dayKey(d)]||{}).r)d.setDate(d.getDate()-1);
  while((S.hist[dayKey(d)]||{}).r>0){n++;d.setDate(d.getDate()-1);}

}

  <button class="rowbtn" onclick="togglePlan()">Przypomnienia o nauce <span class="sw ${p.on?"on":""}">${p.on?"włączone":"wyłączone"}</span></button>
  <div class="lab" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px">Dni nauki</div>
  <div class="chips">${[1,2,3,4,5,6,0].map(d=>`<button class="chip ${p.days.includes(d)?"on":""}" onclick="toggleDay(${d})">${DN[d]}</button>`).join("")}</div>
  <div class="field">Pierwsza sesja o<input type="time" value="${String(p.hour).padStart(2,"0")}:${String(p.min).padStart(2,"0")}" onchange="setTime(this.value)"></div>
  <div class="lab" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px">Długość sesji</div>
  <div class="opts">${[5,10,15,20,30].map(m=>`<button class="opt ${p.minutes===m?"on":""}" onclick="setMinutes(${m})">${m} min</button>`).join("")}</div>
  <div class="lab" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px">Sesji dziennie</div>
  <div class="opts">${[1,2,3].map(n=>`<button class="opt ${p.perDay===n?"on":""}" onclick="setPerDay(${n})">${n}×</button>`).join("")}</div>
  <div class="goal">Cel dzienny: <b>${dailyGoal()} fiszek</b> (${p.minutes} min × ${p.perDay})<br>
    Przypomnienia: <b>${p.on?slots().map(([h,m])=>String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")).join(", "):"wyłączone"}</b><br>
    Dni: <b>${p.days.length?p.days.slice().sort().map(d=>DN[d]).join(" "):"żaden"}</b></div>
  <div class="hint">Powiadomienie systemowe dociera, gdy aplikacja jest otwarta lub w tle. Żeby przypomnienie zadziałało przy zablokowanym telefonie, ustaw dodatkowo budzik o tej samej godzinie.</div>

  <div class="eyebrow" style="margin-top:26px">Ustawienia</div>
  <button class="rowbtn" onclick="toggleTheme()">Motyw <span class="sw ${S.theme==="dark"?"on":""}">${S.theme==="dark"?"ciemny":"jasny"}</span></button>
  <button class="rowbtn" onclick="toggleTap()">Wymowa po dotknięciu słowa <span class="sw ${S.speakTap?"on":""}">${S.speakTap?"włączona":"wyłączona"}</span></button>
  <button class="rowbtn" onclick="toggleRate()">Tempo mowy <span class="sw ${S.rate<.8?"on":""}">${S.rate<.8?"wolne":"normalne"}</span></button>
  <button class="rowbtn" onclick="speak('This is how the pronunciation sounds.')">Sprawdź wymowę <span class="sw">test</span></button>
  <button class="rowbtn" onclick="fire()">Sprawdź przypomnienie <span class="sw">test</span></button>
  <div class="lab" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 6px">Klucz API (opcjonalny)</div>
  <input class="txt" type="password" placeholder="sk-ant-… — tylko do pisania nowych tekstów" value="${S.apiKey||""}" onchange="setKey(this.value)">
  <div class="hint" style="margin-bottom:14px">Bez klucza aplikacja działa w pełni offline: teksty wbudowane, słownik ${WORDLIST.length} haseł, wymowa, powtórki. Klucz włącza pisanie nowych tekstów i tłumaczenie słów spoza listy. Trzymany jest tylko na tym telefonie.</div>
  <button class="rowbtn" onclick="wipe()">Usuń wszystkie dane <span class="sw">reset</span></button>
  <div class="hint" style="margin-top:10px">Lista dozwolonych słów: ${WORDLIST.length} haseł. Teksty w aplikacji są budowane wyłącznie z nich.</div>`;
}
function toggleDay(d){
  const i=S.plan.days.indexOf(d);
  if(i<0)S.plan.days.push(d);else S.plan.days.splice(i,1);
  save();scheduleAll();renderStats();
}
function setTime(v){const[h,m]=v.split(":").map(Number);S.plan.hour=h||0;S.plan.min=m||0;save();scheduleAll();renderStats();}
function setMinutes(m){S.plan.minutes=m;save();scheduleAll();renderStats();}
function setPerDay(n){S.plan.perDay=n;save();scheduleAll();renderStats();}
function setKey(v){S.apiKey=v.trim();save();toast(S.apiKey?"Klucz zapisany":"Klucz usunięty");}
function toggleTap(){S.speakTap=!S.speakTap;save();renderStats();}
function toggleRate(){S.rate=S.rate<.8?.92:.68;save();renderStats();}

/* ---------- drobiazgi ---------- */
let tT=null;
function toast(html){const t=document.getElementById("toast");t.innerHTML=html;t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),2400);}
async function wipe(){
  if(!confirm("Usunąć wszystkie zebrane słowa, postępy i wygenerowane teksty?"))return;
  const th=S.theme,pl=S.plan,ak=S.apiKey;
  S={words:{},texts:[],read:{},hist:{},theme:th,speakTap:true,rate:.92,lastReviewDay:"",reviewedToday:0,plan:pl,lastNotify:"",apiKey:ak};
  try{await Store.del(KEY);}catch(e){}
  save();renderStats();meter();toast("Dane usunięte");
}
document.getElementById("themebtn").onclick=toggleTheme;

if("serviceWorker" in navigator&&location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(()=>{});

(async()=>{await load();applyTheme();renderTexts();meter();scheduleAll();})();
</script>
</body>
</html>
